services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orderflow
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - orderflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orderflow"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://orderflow:${POSTGRES_PASSWORD:-local-development-only}@db:5432/orderflow
      ENVIRONMENT: production
      AUTO_CREATE_TABLES: "false"
      SESSION_HTTPS_ONLY: "false" # Set true behind an HTTPS-terminating proxy in production.
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://orderflow:${POSTGRES_PASSWORD:-local-development-only}@db:5432/orderflow
      ENVIRONMENT: production
      AUTO_CREATE_TABLES: "false"
    command: ["python", "-m", "app.worker"]
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  orderflow-postgres:
